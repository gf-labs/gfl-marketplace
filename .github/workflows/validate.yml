name: validate

# A marketplace is only as good as its manifest. This gate parses and validates
# .claude-plugin/marketplace.json on every change so a broken catalog can never
# reach main (and never break `/plugin install` for anyone downstream).

on:
  push:
    paths:
      - ".claude-plugin/marketplace.json"
      - "scripts/validate-marketplace.py"
      - ".github/workflows/validate.yml"
      # README's plugins badge is cross-checked by the validator, so doc-only edits must re-run it.
      - "README.md"
  # Deliberately unfiltered, unlike the push trigger above. `validate` is a
  # required status check on main, and GitHub does not count a path-filtered-out
  # workflow as passing — it reports nothing, so the PR waits forever on a check
  # that will never arrive. Running the validator on every PR costs ~15s and
  # keeps any PR mergeable; a filter here would deadlock doc-only or asset-only
  # changes (CLAUDE.md, LICENSE, docs/assets/) with admin override as the only exit.
  pull_request:
  workflow_dispatch:

# Least privilege: the job only needs to read the checked-out tree.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs; Dependabot keeps them current (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate marketplace manifest
        run: python3 scripts/validate-marketplace.py
